# ==============================================================================
# AgroSmart Production Spring Boot Configuration
# ==============================================================================
# Profile: prod
# Activate with: java -jar -Dspring.profiles.active=prod backend.jar
# Or set environment variable: SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

server.port=${PORT:8080}

# Remote Cloud MySQL Connection (Aiven / AWS RDS / GCP Cloud SQL / Railway / PlanetScale)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agrosmart_db}?useSSL=true&requireSSL=false&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Tuning (HikariCP for high concurrency)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Production Tuning
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cloud SQL Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Production JWT Configuration
app.jwt.secret=${JWT_SECRET:AgroSmartProductionSuperSecretKey2026AgriculturalCloudDeployment}
app.jwt.expiration-milliseconds=604800000

# Production Multipart Limits (Photos, Soil Test Reports, Field Inspections)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
