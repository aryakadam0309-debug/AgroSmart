# AgroSmart Spring Boot Configuration
server.port=${PORT:8080}

# MySQL Database Configuration (Environment variable overrides with safe local defaults)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agrosmart_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional: Run SQL script on startup if tables are empty
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:AgroSmartSecretKeyForJWTAuthentication2026AdvancedSmartFarmingPlatform}
app.jwt.expiration-milliseconds=86400000

# File upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Weather & Smart Farming Advisory Configuration (PS 5.4)
weather.api.key=${OPENWEATHER_API_KEY:}
weather.api.url=https://api.openweathermap.org/data/2.5/forecast
weather.api.openmeteo.url=https://api.open-meteo.com/v1/forecast
weather.monitoring.enabled=true
weather.monitoring.fixed-rate-ms=900000
